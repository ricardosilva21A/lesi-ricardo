<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0f">
<meta name="robots" content="noindex, nofollow">
<title>Notas · Avaliações LESI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
  :root { --bg:#f6f6f8; --card:#fff; --txt:#111116; --sub:#6b6b76; --line:#e6e6ec; --acc:#111116; --accTxt:#fff; --chip:#ececf1; --ok:#1f9d55; --okBg:#e7f6ed; --warn:#d97706; --warnBg:#fdf3e3; --bad:#e5484d; --badBg:#fdecec; --r:16px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0f; --card:#16161c; --txt:#f2f2f5; --sub:#9a9aa6; --line:#26262f; --acc:#f2f2f5; --accTxt:#0b0b0f; --chip:#22222a; --okBg:#0f2a1b; --warnBg:#2e2210; --badBg:#331517; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:max(20px,env(safe-area-inset-top)) 16px 60px; }
  a { color:inherit; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:8px 0 2px; }
  .sub { color:var(--sub); margin:0; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0; }
  .uc { display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; }
  .badge { font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; color:#fff; }
  .comp { margin-top:12px; }
  .comp .nome { font-weight:600; font-size:14px; display:flex; justify-content:space-between; gap:8px; }
  .comp .nome small { color:var(--sub); font-weight:500; }
  .filhos { margin-left:12px; padding-left:12px; border-left:2px solid var(--line); }
  .leaf { display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .leaf:last-child { border-bottom:0; }
  .leaf .t { font-size:14px; }
  .leaf .t small { display:block; color:var(--sub); font-size:12px; }
  input[type=number] { width:76px; font:inherit; font-size:16px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); text-align:center; }
  input.falta { border-style:dashed; }
  .res { margin-top:14px; padding:12px; border-radius:12px; background:var(--chip); }
  .big { font-size:34px; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
  .big small { font-size:15px; font-weight:500; color:var(--sub); }
  table { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
  td { padding:7px 4px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-weight:700; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .alerta { margin-top:10px; padding:10px 12px; border-radius:10px; font-size:14px; }
  .alerta.bad { background:var(--badBg); } .alerta.warn { background:var(--warnBg); } .alerta.ok { background:var(--okBg); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; font-size:14px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; padding:7px 12px; background:var(--chip); color:var(--txt); font-size:13px; }
  .vazio { color:var(--sub); font-size:14px; }
  code { font-size:12px; background:var(--chip); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/" class="sub">← Avaliações</a>
  <h1>Notas</h1>
  <p class="sub">Escreve as notas que já tens. As que faltam ficam em branco e eu calculo quanto precisas. Fica tudo guardado só neste dispositivo.</p>
  <div id="lista"></div>
</div>
<script>
(async function () {
  const D = await fetch("/avaliacoes.json", { cache: "no-store" }).then(r => r.json());
  const K = "notas";
  const store = {
    get(d) { try { return JSON.parse(localStorage.getItem(K)) || d; } catch { return d; } },
    set(v) { try { localStorage.setItem(K, JSON.stringify(v)); } catch {} }
  };
  let notas = store.get({});
  const alvosK = "alvos";
  let alvos = (() => { try { return JSON.parse(localStorage.getItem(alvosK)) || {}; } catch { return {}; } })();
  const av = Object.fromEntries(D.avaliacoes.map(a => [a.id, a]));
  const f1 = x => (Math.round(x * 100) / 100).toLocaleString("pt-PT", { maximumFractionDigits: 2 });
  const fData = id => { const a = av[id]; if (!a) return ""; const [y, m, d] = a.data.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("pt-PT", { day: "numeric", month: "short" }); };

  // ---------- modelo ----------
  // cada nó: { id, nome, peso, min?, filhos? }. Pesos relativos dentro do pai.
  // Valor de cada nó = a + b·g, em que g é a nota (igual) em todas as avaliações em falta.
  function linear(node, sig) {
    if (!node.filhos) {
      const v = notas[sig]?.[node.id];
      return (v === undefined || v === "" || v === null) ? { a: 0, b: 1, folhas: [node], falta: [node] } : { a: +v, b: 0, folhas: [node], falta: [] };
    }
    const tot = node.filhos.reduce((s, f) => s + f.peso, 0);
    let a = 0, b = 0, folhas = [], falta = [];
    node.filhos.forEach(f => { const r = linear(f, sig); a += r.a * f.peso / tot; b += r.b * f.peso / tot; folhas.push(...r.folhas); falta.push(...r.falta); });
    return { a, b, folhas, falta };
  }

  function analisa(uc) {
    const raiz = { id: "final", nome: "Nota final", filhos: uc.avaliacao };
    const fin = linear(raiz, uc.sigla);
    // restrições: g ≥ gMin para cumprir mínimos; mínimos já falhados
    let gMin = 0; const falhados = [], minimos = [];
    (function walk(n) {
      if (n.min !== undefined && n.min !== null) {
        const r = linear(n, uc.sigla);
        if (r.b === 0) { if (r.a < n.min) falhados.push(`${n.nome}: ${f1(r.a)} < mínimo ${n.min}`); }
        else { const need = (n.min - r.a) / r.b; gMin = Math.max(gMin, need); minimos.push({ n, need }); }
      }
      (n.filhos || []).forEach(walk);
    })(raiz);
    return { fin, gMin, falhados, minimos };
  }

  function precisa(fin, gMin, alvo) {
    if (fin.b === 0) return null;
    const g = Math.max(gMin, (alvo - fin.a) / fin.b, 0);
    return g;
  }

  // ---------- render ----------
  function compHtml(n, sig, nivel) {
    if (n.filhos) {
      return `<div class="comp"><div class="nome"><span>${n.nome}</span><small>${n.peso}%${n.min != null ? ` · mín. ${n.min}` : ""}</small></div>
        <div class="filhos">${n.filhos.map(f => compHtml(f, sig, nivel + 1)).join("")}</div></div>`;
    }
    const v = notas[sig]?.[n.id] ?? "";
    const data = n.avaliacao ? fData(n.avaliacao) : "";
    return `<div class="leaf"><div class="t">${n.nome} <small>${n.peso}%${n.min != null ? ` · mínimo ${n.min}` : ""}${data ? ` · ${data}` : ""}</small></div>
      <input type="number" inputmode="decimal" min="0" max="20" step="0.1" placeholder="?" value="${v}" data-uc="${sig}" data-id="${n.id}" class="${v === "" ? "falta" : ""}"></div>`;
  }

  function resultadoHtml(uc) {
    const { fin, gMin, falhados } = analisa(uc);
    const sig = uc.sigla;
    if (fin.b === 0) {
      const ok = fin.a >= 9.5 && !falhados.length;
      return `<div class="res"><div class="sub">Nota final</div><div class="big ${ok ? "ok" : "bad"}">${f1(fin.a)} <small>/ 20 → ${Math.round(fin.a)}</small></div>
        ${falhados.length ? `<div class="alerta bad">Reprovado por nota mínima: ${falhados.join("; ")}</div>` : `<div class="alerta ${ok ? "ok" : "bad"}">${ok ? "Aprovado 🎉" : "Abaixo de 9,5"}</div>`}</div>`;
    }
    const nomesFalta = fin.falta.map(f => f.nome).join(", ");
    const alvoUser = alvos[sig] ?? 14;
    const linhas = [9.5, 12, 14, 16, alvoUser].filter((x, i, a) => a.indexOf(x) === i).sort((a, b) => a - b).map(alvo => {
      const g = precisa(fin, gMin, alvo);
      const txt = g > 20 ? `<span class="bad">impossível</span>` : `<span class="${g >= 15 ? "warn" : "ok"}">${f1(Math.max(g, 0))}</span>`;
      return `<tr><td>${alvo === 9.5 ? "Passar (9,5)" : "Ter " + String(alvo).replace(".", ",")}</td><td>${txt}</td></tr>`;
    }).join("");
    const atual = fin.a / (1 - fin.b || 1);
    const maxPossivel = fin.a + fin.b * 20;
    const minPossivel = fin.a + fin.b * Math.max(gMin, 0);
    return `<div class="res">
      <div class="sub">Em falta: ${nomesFalta}</div>
      ${fin.b < 1 ? `<div class="big">${f1(atual)} <small>média do que já fizeste</small></div>` : ""}
      ${falhados.length ? `<div class="alerta bad">Já falhaste uma nota mínima: ${falhados.join("; ")}</div>` : ""}
      <table>
        <tr><td class="sub">Para…</td><td class="sub" style="font-weight:500">precisas de (em cada uma)</td></tr>
        ${linhas}
      </table>
      ${gMin > 0 ? `<div class="alerta warn">Mínimos: nunca menos de ${f1(gMin)} ${fin.falta.length > 1 ? "nas que faltam" : "na que falta"}, mesmo que a média chegasse.</div>` : ""}
      <div class="row">Objetivo personalizado: <input type="number" min="0" max="20" step="0.5" value="${alvoUser}" data-alvo="${sig}" style="width:70px"></div>
      <div class="row sub">Com 20 em tudo o que falta: ${f1(Math.min(maxPossivel, 20))} · com o mínimo exigido: ${f1(minPossivel)}</div>
    </div>`;
  }

  function render() {
    const comAv = D.ucs.filter(u => u.avaliacao), semAv = D.ucs.filter(u => !u.avaliacao);
    document.getElementById("lista").innerHTML =
      comAv.map(u => `<div class="card" data-card="${u.sigla}">
        <div class="uc"><span class="badge" style="background:${u.cor}">${u.sigla}</span>${u.nome}</div>
        ${u.avaliacao.map(n => compHtml(n, u.sigla, 0)).join("")}
        <div data-res="${u.sigla}">${resultadoHtml(u)}</div>
        <div class="row"><button data-limpar="${u.sigla}">Limpar notas</button></div>
      </div>`).join("") +
      (semAv.length ? `<div class="card"><div class="vazio">Sem método de avaliação definido: ${semAv.map(u => u.sigla).join(", ")}.<br>Diz-me os pesos (ou edita o campo <code>avaliacao</code> da UC no <code>avaliacoes.json</code>).</div></div>` : "");
  }

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.uc) {
      let v = t.value === "" ? "" : Math.max(0, Math.min(20, +t.value.replace(",", ".")));
      notas[t.dataset.uc] = notas[t.dataset.uc] || {};
      if (v === "") delete notas[t.dataset.uc][t.dataset.id]; else notas[t.dataset.uc][t.dataset.id] = v;
      t.classList.toggle("falta", v === "");
      store.set(notas);
      const uc = D.ucs.find(u => u.sigla === t.dataset.uc);
      document.querySelector(`[data-res="${uc.sigla}"]`).innerHTML = resultadoHtml(uc);
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.alvo) {
      alvos[t.dataset.alvo] = Math.max(0, Math.min(20, +t.value || 0));
      try { localStorage.setItem(alvosK, JSON.stringify(alvos)); } catch {}
      const uc = D.ucs.find(u => u.sigla === t.dataset.alvo);
      document.querySelector(`[data-res="${uc.sigla}"]`).innerHTML = resultadoHtml(uc);
    }
  });
  document.addEventListener("click", e => {
    const s = e.target.dataset?.limpar;
    if (s) { delete notas[s]; store.set(notas); render(); }
  });
  render();
})();
</script>
</body>
</html>
