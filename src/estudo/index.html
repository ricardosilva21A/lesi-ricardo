<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0f">
<meta name="robots" content="noindex, nofollow">
<title>Estudo · Avaliações LESI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root { --bg:#f6f6f8; --card:#fff; --txt:#111116; --sub:#6b6b76; --line:#e6e6ec; --acc:#111116; --accTxt:#fff; --chip:#ececf1; --ok:#1f9d55; --okBg:#e7f6ed; --bad:#e5484d; --badBg:#fdecec; --r:16px; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0b0f; --card:#16161c; --txt:#f2f2f5; --sub:#9a9aa6; --line:#26262f; --acc:#f2f2f5; --accTxt:#0b0b0f; --chip:#22222a; --okBg:#0f2a1b; --badBg:#331517; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:max(20px,env(safe-area-inset-top)) 16px 80px; }
  a { color: inherit; }
  h1 { font-size:26px; letter-spacing:-.02em; margin:6px 0 2px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--sub); margin:26px 0 10px; font-weight:600; }
  .sub { color:var(--sub); margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:10px; }
  button, .btn { font:inherit; cursor:pointer; border:0; border-radius:999px; padding:10px 16px; background:var(--chip); color:var(--txt); text-decoration:none; display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:500; }
  .btn.primary, button.primary { background:var(--acc); color:var(--accTxt); }
  button:disabled { opacity:.4; cursor:default; }
  .modes { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .mode { text-align:left; display:block; border-radius:var(--r); padding:16px; background:var(--card); border:1px solid var(--line); }
  .mode b { display:block; font-size:16px; margin-bottom:2px; }
  .mode span { color:var(--sub); font-size:13px; }
  .grupo { font-weight:700; margin:22px 0 8px; display:flex; justify-content:space-between; }
  .grupo small { color:var(--sub); font-weight:500; }
  .q .n { font-size:12px; color:var(--sub); margin-bottom:4px; }
  .q .e { font-weight:500; margin-bottom:12px; white-space:pre-wrap; }
  .q img { max-width:100%; border-radius:10px; }
  .opt { display:flex; gap:10px; width:100%; text-align:left; border-radius:12px; padding:11px 12px; margin-bottom:6px; background:var(--chip); border:2px solid transparent; font-weight:400; }
  .opt .l { font-weight:700; min-width:18px; }
  .opt.sel { border-color:var(--acc); }
  .opt.ok { background:var(--okBg); border-color:var(--ok); }
  .opt.bad { background:var(--badBg); border-color:var(--bad); }
  .expl { margin-top:10px; padding:10px 12px; border-radius:12px; background:var(--chip); font-size:14px; white-space:pre-wrap; }
  .res { margin-top:10px; padding:12px; border-radius:12px; border:1px dashed var(--line); white-space:pre-wrap; }
  textarea { width:100%; min-height:90px; font:inherit; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--txt); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .sticky { position:sticky; bottom:12px; display:flex; justify-content:center; margin-top:20px; }
  .score { font-size:46px; font-weight:800; letter-spacing:-.03em; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--sub); }
  .prog { height:6px; background:var(--chip); border-radius:99px; overflow:hidden; margin:8px 0 16px; }
  .prog i { display:block; height:100%; background:var(--acc); transition:width .2s; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 4px; border-bottom:1px solid var(--line); }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .al { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .al .an { font-weight:700; margin-right:6px; }
  .al .ac { font-size:12px; color:var(--sub); margin-left:6px; }
  .al .ae { white-space:pre-wrap; }
  .fonte { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--chip); color:var(--sub); margin-left:6px; white-space:nowrap; }
  .fonte.real { background:#7c5cff; color:#fff; }
  .q svg text { paint-order: normal; }
  .filtros { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
  .lado { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width: 1000px) { .wrap.largo { max-width:1240px; } .lado { grid-template-columns:1fr 1fr; align-items:start; } .lado .prof { position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; } }
  .prof { border:1px solid var(--line); border-radius:12px; padding:10px; background:var(--bg); }
  .prof canvas { width:100%; border-radius:8px; background:#fff; margin-bottom:8px; display:block; }
  .prof .sub { font-size:13px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">A carregar…</p></div>
<script>
(async function () {
  const app = document.getElementById("app");
  const params = new URLSearchParams(location.search);
  const bancoId = params.get("banco");
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = s => String(s ?? "");
  const math = el => { if (window.renderMathInElement) renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false }); };
  window.addEventListener("load", () => math(app));
  const draw = html => { app.innerHTML = html; math(app); window.scrollTo(0, 0); };
  const fmtN = x => (Math.round(x * 10) / 10).toString().replace(".", ",");

  // ---------- lista de bancos ----------
  if (!bancoId) {
    const lista = await fetch("bancos/index.json", { cache: "no-store" }).then(r => r.json()).catch(() => []);
    draw(`
      <a href="/" class="sub">← Avaliações</a>
      <h1>Estudo</h1>
      <p class="sub">Escolhe a disciplina para treinar.</p>
      <h2>Bancos de perguntas</h2>
      ${lista.length ? lista.map(b => `<a class="card" style="display:block;text-decoration:none" href="?banco=${encodeURIComponent(b.id)}"><b>${b.uc ? b.uc + " · " : ""}${esc(b.titulo)}</b><div class="sub" style="font-size:14px">${b.perguntas} perguntas</div></a>`).join("") : `<div class="card sub">Ainda não há bancos de perguntas.</div>`}
    `);
    return;
  }

  // ---------- banco ----------
  const B = await fetch(`bancos/${encodeURIComponent(bancoId)}.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => null);
  if (!B) { draw(`<a href="./" class="sub">← Estudo</a><h1>Banco não encontrado</h1>`); return; }
  B.perguntas.forEach((q, i) => { q._id = q.id || `${bancoId}-${i}`; q.tipo = q.tipo || (q.opcoes ? "escolha" : "aberta"); });
  const porId = Object.fromEntries(B.perguntas.map(q => [q._id, q]));
  const kErr = `erradas:${bancoId}`, kHist = `historico:${bancoId}`, kFeitas = `feitas:${bancoId}`;
  const erradas = () => store.get(kErr, []).filter(id => porId[id]);
  const marcar = (id, certo) => {
    let e = store.get(kErr, []);
    e = certo ? e.filter(x => x !== id) : (e.includes(id) ? e : [...e, id]);
    store.set(kErr, e);
  };
  const feitas = () => new Set(store.get(kFeitas, []));
  const marcarFeita = id => { const f = feitas(); f.add(id); store.set(kFeitas, [...f]); };
  const estrutura = B.estrutura && B.estrutura.length ? B.estrutura : [{ grupo: "Perguntas", n: Math.min(10, B.perguntas.length) }];
  const L = "ABCDEFGH";
  const isReal = q => /real/i.test(q.fonte || "");
  const fonteHtml = q => q.fonte ? `<span class="fonte ${isReal(q) ? "real" : ""}">${esc(q.fonte)}</span>` : "";
  const histPush = (modo, nota) => { const h = store.get(kHist, []); h.push({ t: Date.now(), modo, nota }); store.set(kHist, h.slice(-50)); };

  // texto da correção de uma escolha múltipla (r = índice mostrado escolhido, it = item preparado)
  const fbEscolha = (it, r) => {
    const q = it.q;
    if (r === undefined) return `Sem resposta. ✅ Certa: «${esc(q.opcoes[q.correta])}». ${esc(q.explicacao || "")}`;
    if (r === it.correta) return `✅ Certo. ${esc(q.explicacao || "")}`;
    const oi = it.ordem[r];
    const porque = q.porque && q.porque[oi];
    return `❌ Escolheste «${esc(q.opcoes[oi])}»${porque ? `: ${esc(porque)}` : "."}\n\n✅ Certa: «${esc(q.opcoes[q.correta])}». ${esc(q.explicacao || "")}`;
  };

  // ---------- correção da professora: PDF guardado só neste navegador ----------
  const idb = {
    open: () => new Promise((res, rej) => { const r = indexedDB.open("estudo", 1); r.onupgradeneeded = () => r.result.createObjectStore("pdfs"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
    async get(k) { try { const db = await idb.open(); return await new Promise(res => { const t = db.transaction("pdfs").objectStore("pdfs").get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); }); } catch { return null; } },
    async set(k, v) { try { const db = await idb.open(); await new Promise(res => { const t = db.transaction("pdfs", "readwrite"); t.objectStore("pdfs").put(v, k); t.oncomplete = res; t.onerror = res; }); return true; } catch { return false; } }
  };
  let pdfLib = null;
  const carregaPdfJs = () => pdfLib || (pdfLib = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "/vendor/pdfjs/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.js"; res(window.pdfjsLib); };
    sc.onerror = rej; document.head.appendChild(sc);
  }));
  const docsAbertos = {};
  // chave das correções encriptadas: chega uma vez pelo link (#chave=...) e fica guardada neste navegador
  (() => {
    const m = location.hash.match(/chave=([A-Za-z0-9_-]+)/);
    if (m) { try { localStorage.setItem("chave-correcoes", m[1]); } catch {} history.replaceState(null, "", location.pathname + location.search); }
  })();
  const b64u = t => Uint8Array.from(atob(t.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((t.length + 3) % 4)), ch => ch.charCodeAt(0));
  async function desencripta(c) {
    let chave = null; try { chave = localStorage.getItem("chave-correcoes"); } catch {}
    if (!chave || !c.enc || !window.crypto?.subtle) return null;
    try {
      const raw = new Uint8Array(await fetch(c.enc).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }));
      const key = await crypto.subtle.importKey("raw", b64u(chave), "AES-GCM", false, ["decrypt"]);
      const pdf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
      await idb.set(c.pdf, pdf);
      return pdf;
    } catch { return null; }
  }
  async function mostraCorrecao(el, c) {
    let buf = await idb.get(c.pdf);
    if (!buf && c.enc) { el.innerHTML = `<p class="sub">A abrir a correção…</p>`; buf = await desencripta(c); }
    if (!buf) {
      el.innerHTML = `<b>Correção da professora</b><p class="sub">Para ver a correção abre o site uma vez pelo teu link com a chave. Em alternativa, escolhe o ficheiro <b>${esc(c.pdf)}</b> no teu computador (fica só neste navegador).</p><input type="file" accept="application/pdf">`;
      el.querySelector("input").onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        el.innerHTML = `<p class="sub">A guardar…</p>`;
        await idb.set(c.pdf, await f.arrayBuffer());
        delete docsAbertos[c.pdf];
        document.querySelectorAll(`[data-pdf="${CSS.escape(c.pdf)}"]`).forEach(x => mostraCorrecao(x, JSON.parse(x.dataset.c)));
      };
      return;
    }
    el.innerHTML = `<b>Correção da professora</b> <span class="sub">· ${esc(c.pdf)}, pág. ${c.paginas.join(", ")} · procura o exercício ${esc(c.ex || "")}</span><div class="pags"><p class="sub">A abrir…</p></div><button class="trocar" style="margin-top:6px;font-size:12px;padding:6px 10px">Trocar ficheiro</button>`;
    el.querySelector(".trocar").onclick = async () => { await idb.set(c.pdf, null); delete docsAbertos[c.pdf]; mostraCorrecao(el, c); };
    try {
      const lib = await carregaPdfJs();
      const doc = await (docsAbertos[c.pdf] || (docsAbertos[c.pdf] = lib.getDocument({ data: buf.slice(0) }).promise));
      const box = el.querySelector(".pags"); box.innerHTML = "";
      for (const n of c.paginas) {
        if (n > doc.numPages) continue;
        const page = await doc.getPage(n);
        const v1 = page.getViewport({ scale: 1 });
        const scale = Math.min(2.2, (box.clientWidth || 600) * (window.devicePixelRatio || 1) / v1.width);
        const vp = page.getViewport({ scale });
        const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
        box.appendChild(cv);
        await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      }
    } catch (err) {
      el.querySelector(".pags").innerHTML = `<p class="sub">Não consegui abrir este PDF. Carrega em "Trocar ficheiro" e escolhe o certo.</p>`;
    }
  }
  const blocoCorrecao = c => `<div class="prof" data-pdf="${esc(c.pdf)}" data-c='${JSON.stringify(c).replace(/'/g, "&#39;")}'></div>`;
  const ativaCorrecoes = root => root.querySelectorAll(".prof[data-pdf]").forEach(x => { if (!x.dataset.on) { x.dataset.on = 1; mostraCorrecao(x, JSON.parse(x.dataset.c)); } });

  const prepara = q => {
    if (q.tipo !== "escolha") return { q };
    const ordem = shuffle(q.opcoes.map((_, i) => i));
    return { q, ordem, correta: ordem.indexOf(q.correta) };
  };

  function menu() {
    app.classList.remove("largo");
    const hist = store.get(kHist, []);
    const err = erradas();
    const errEsc = err.filter(id => porId[id].tipo === "escolha");
    const errAb = err.filter(id => porId[id].tipo !== "escolha");
    const nEsc = B.perguntas.filter(q => q.tipo === "escolha").length;
    const reais = B.testesReais || [];
    draw(`
      <a href="./" class="sub">← Estudo</a>
      <h1>${B.uc ? B.uc + " · " : ""}${esc(B.titulo)}</h1>
      <p class="sub">${B.perguntas.length} perguntas${B.descricao ? " · " + esc(B.descricao) : ""}</p>
      <div class="row" style="margin-top:12px">${B.cabula ? `<a class="btn primary" href="${B.cabula}" target="_blank" rel="noopener">📄 Abrir a cábula</a>` : ""}${(B.extra || []).map(x => `<a class="btn" href="?banco=${encodeURIComponent(x.banco)}">📘 ${esc(x.titulo)}</a>`).join("")}</div>
      ${reais.length ? `<h2>1. Testes reais resolvidos</h2>
        ${reais.map((t, i) => `<button class="mode" style="width:100%;margin-bottom:8px" data-real="${i}"><b>📄 ${esc(t.titulo)}</b><span>${t.nota ? esc(t.nota) + " " : ""}${t.ids.length} grupos</span></button>`).join("")}` : ""}
      <h2>${reais.length ? "2. " : ""}Treinar</h2>
      <div class="modes">
        <button class="mode" data-m="modelo"><b>📝 Teste modelo</b><span>${estrutura.map(g => `${esc(g.grupo)}${g.cotacao ? ` (${fmtN(g.cotacao)} val.)` : ""}`).join(" · ")}. Exercícios novos em cada tentativa.</span></button>
        <button class="mode" data-m="treino" ${nEsc ? "" : "disabled"}><b>🎯 Conceitos (escolha múltipla)</b><span>${nEsc} perguntas uma a uma, com correção imediata. As que erras voltam no fim.</span></button>
        <button class="mode" data-m="grupo"><b>🧩 Treinar um grupo</b><span>Só exercícios do grupo onde tens mais dificuldade.</span></button>
        <button class="mode" data-m="erradas" ${err.length ? "" : "disabled"}><b>🔁 Repetir o que falhei</b><span>${err.length ? `${errAb.length} exercícios · ${errEsc.length} escolhas múltiplas` : "Nada por rever"}</span></button>
        <button class="mode" data-m="tudo"><b>📖 Ver resoluções</b><span>Consultar exercícios resolvidos por grupo.</span></button>
      </div>
      ${hist.length ? `<h2>Histórico</h2><div class="card"><table>${hist.slice(-10).reverse().map(h => `<tr><td>${new Date(h.t).toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" })} ${new Date(h.t).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" })}</td><td>${esc(h.modo)}</td><td style="text-align:right"><b>${esc(h.nota)}</b></td></tr>`).join("")}</table></div>` : ""}
    `);
    app.querySelectorAll("[data-real]").forEach(b => b.onclick = () => {
      const t = reais[+b.dataset.real];
      const grupos = t.ids.map(id => porId[id]).filter(Boolean).map(q => ({ grupo: q.grupo, cotacao: somaCot(q) / 10, itens: [prepara(q)] }));
      runTest(grupos, t.titulo);
    });
    app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => ({
      modelo: () => testeModelo(),
      treino: () => treino(B.perguntas.filter(q => q.tipo === "escolha")),
      grupo: escolherGrupo,
      erradas: () => {
        if (errAb.length) runTest(errAb.map(id => porId[id]).map(q => ({ grupo: q.grupo, cotacao: grupoCot(q.grupo), itens: [prepara(q)] })), "Rever falhados", () => errEsc.length && treino(errEsc.map(id => porId[id])));
        else treino(errEsc.map(id => porId[id]));
      },
      tudo: verTudo
    })[b.dataset.m]());
  }

  const somaCot = q => (q.alineas || []).reduce((s, a) => s + (+a.cotacao || 0), 0) || 10;
  const grupoCot = g => (estrutura.find(e => e.grupo === g) || {}).cotacao || 1;

  // escolhe perguntas novas primeiro
  function sortear(pool, n) {
    const f = feitas();
    const novas = shuffle(pool.filter(q => !f.has(q._id) && !isReal(q)));
    const resto = shuffle(pool.filter(q => f.has(q._id) && !isReal(q)));
    const reais = shuffle(pool.filter(isReal));
    return [...novas, ...resto, ...reais].slice(0, n);
  }

  function testeModelo(soGrupo) {
    const est = soGrupo ? estrutura.filter(g => g.grupo === soGrupo) : estrutura;
    const grupos = est.map(g => {
      const pool = B.perguntas.filter(q => (q.grupo || "Perguntas") === g.grupo && q.tipo !== "escolha");
      return { ...g, itens: sortear(pool, soGrupo ? 1 : g.n).map(prepara) };
    });
    runTest(grupos, soGrupo ? `Treino · ${soGrupo}` : "Teste modelo", null, () => testeModelo(soGrupo));
  }

  function escolherGrupo() {
    draw(`<div class="top"><button id="sair">← Menu</button></div><h1>Que grupo queres treinar?</h1>
      ${estrutura.map((g, i) => `<button class="mode" style="width:100%;margin-bottom:8px" data-g="${i}"><b>${esc(g.grupo)}</b><span>${B.perguntas.filter(q => q.grupo === g.grupo).length} exercícios</span></button>`).join("")}`);
    app.querySelector("#sair").onclick = menu;
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => testeModelo(estrutura[+b.dataset.g].grupo));
  }

  // ---------- teste (modelo, real ou revisão) ----------
  function runTest(grupos, titulo, depois, repetir) {
    const resp = {};
    app.classList.toggle("largo", grupos.some(g => g.itens.some(it => it.q.correcao)));
    let n = 0;
    draw(`
      <div class="top"><button id="sair">← Sair</button><span class="pill">${esc(titulo)}</span></div>
      <h1>${B.uc ? B.uc + " · " : ""}${esc(B.titulo)}</h1>
      <p class="sub">Resolve no papel como no teste e depois carrega em "Corrigir" para veres as resoluções e te autoavaliares alínea a alínea.</p>
      ${grupos.map((g, gi) => `
        <div class="grupo">${esc(g.grupo)} <small>${g.cotacao ? fmtN(g.cotacao) + " valores" : ""}</small></div>
        ${g.itens.length ? g.itens.map((it, qi) => { n++; return pergunta(it, `${gi}-${qi}`, gi + 1); }).join("") : `<div class="card sub">Sem exercícios deste grupo no banco.</div>`}
      `).join("")}
      <div class="sticky"><button class="primary" id="entregar">Corrigir</button></div>
    `);
    app.querySelector("#sair").onclick = menu;
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      app.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); resp[k] = +b.dataset.i;
    });
    app.querySelector("#entregar").onclick = () => corrigir(grupos, resp, titulo, depois, repetir);
  }

  function pergunta(it, k, num) {
    const q = it.q;
    const corpo = q.tipo === "escolha"
      ? it.ordem.map((oi, i) => `<button class="opt" data-k="${k}" data-i="${i}"><span class="l">${L[i]}</span><span>${esc(q.opcoes[oi])}</span></button>`).join("")
      : q.alineas
        ? q.alineas.map((a, j) => `<div class="al" id="al-${k}-${j}"><div><span class="an">${num}.${j + 1}</span><span class="ae">${esc(a.enunciado)}</span><span class="ac">(${a.cotacao} pts)</span></div><div class="fb"></div></div>`).join("")
        : `<textarea placeholder="Rascunho (opcional)."></textarea>`;
    return `<div class="card q" id="q-${k}">
      <div class="n">${q.tema ? esc(q.tema) : ""}${fonteHtml(q)}</div>
      <div class="e">${esc(q.enunciado)}</div>
      ${q.imagem ? `<img src="${q.imagem}" alt="figura do enunciado" style="background:#fff;padding:6px">` : ""}
      ${corpo}
      ${q.alineas ? "" : `<div class="fb"></div>`}
    </div>`;
  }

  function corrigir(grupos, resp, titulo, depois, repetir) {
    app.querySelectorAll(".opt").forEach(b => b.disabled = true);
    app.querySelector(".sticky").remove();
    const abertas = [];
    let certas = 0, total = 0, pontos = 0, max = 0;
    const btns = key => `<div class="row" style="margin-top:8px"><span class="sub" style="font-size:13px">Como correu?</span>
        <button data-auto="${key}" data-v="1">✅ Certo</button><button data-auto="${key}" data-v="0.5">🟡 Meio</button><button data-auto="${key}" data-v="0">❌ Errado</button></div>`;
    grupos.forEach((g, gi) => g.itens.forEach((it, qi) => {
      const k = `${gi}-${qi}`, card = app.querySelector(`#q-${k}`), q = it.q;
      const valorQ = g.cotacao ? g.cotacao / g.itens.length : 1;
      max += valorQ;
      marcarFeita(q._id);
      if (q.tipo === "escolha") {
        total++;
        const r = resp[k], ok = r === it.correta;
        if (ok) { certas++; pontos += valorQ; }
        marcar(q._id, ok);
        card.querySelectorAll(".opt").forEach((b, i) => { if (i === it.correta) b.classList.add("ok"); else if (i === r) b.classList.add("bad"); });
        card.querySelector(".fb").innerHTML = `<div class="expl">${fbEscolha(it, r)}</div>`;
      } else if (q.alineas) {
        const sc = somaCot(q);
        q.alineas.forEach((a, j) => {
          const key = `${k}-${j}`;
          abertas.push({ key, q, valor: valorQ * (+a.cotacao || 0) / sc });
          card.querySelector(`#al-${key} .fb`).innerHTML = `<div class="res"><b>Resolução</b>\n${esc(a.resolucao)}</div>${btns(key)}`;
        });
      } else {
        abertas.push({ key: k, q, valor: valorQ });
        const resHtml = `<div class="res"><b>Resolução</b>\n${esc(q.resolucao || "")}</div>${btns(k)}`;
        card.querySelector(".fb").innerHTML = q.correcao ? `<div class="lado"><div>${resHtml}</div>${blocoCorrecao(q.correcao)}</div>` : resHtml;
      }
    }));
    math(app);
    ativaCorrecoes(app);
    const auto = {};
    const resumo = document.createElement("div");
    resumo.className = "card"; resumo.style.marginTop = "20px";
    let guardado = false;
    const atualiza = () => {
      const pa = abertas.reduce((s, a) => s + (auto[a.key] ?? 0) * a.valor, 0);
      const nota = max ? (pontos + pa) / max * 20 : 0;
      const falta = abertas.filter(a => auto[a.key] === undefined).length;
      resumo.innerHTML = `<div class="sub">Resultado</div><div class="score">${fmtN(nota)}<span class="sub" style="font-size:18px"> / 20</span></div>
        <div class="sub">${total ? `Escolhas múltiplas: ${certas}/${total} · ` : ""}${abertas.length ? (falta ? `faltam ${falta} alíneas por autoavaliar` : "tudo autoavaliado") : ""}</div>
        <div class="row" style="margin-top:12px">${repetir ? `<button class="primary" id="outro">Gerar outro</button>` : ""}${depois ? `<button id="depois">Continuar</button>` : ""}<button id="voltar">Menu</button></div>`;
      if (repetir) resumo.querySelector("#outro").onclick = repetir;
      if (depois) resumo.querySelector("#depois").onclick = depois;
      resumo.querySelector("#voltar").onclick = menu;
      if (!falta && !guardado) {
        guardado = true; histPush(titulo, fmtN(nota) + "/20");
        // exercício conta como falhado se tiver alguma alínea abaixo de "certo"
        const porQ = {};
        abertas.forEach(a => { porQ[a.q._id] = (porQ[a.q._id] ?? true) && auto[a.key] === 1; });
        Object.entries(porQ).forEach(([id, ok]) => marcar(id, ok));
      }
    };
    app.appendChild(resumo); atualiza();
    app.querySelectorAll("[data-auto]").forEach(b => b.onclick = () => {
      const key = b.dataset.auto;
      auto[key] = +b.dataset.v;
      app.querySelectorAll(`[data-auto="${key}"]`).forEach(x => x.classList.toggle("primary", x === b));
      atualiza();
    });
    if (!abertas.length) resumo.scrollIntoView({ behavior: "smooth" });
    else app.querySelector(".res").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  // ---------- treino uma a uma ----------
  function treino(lista) {
    let fila = shuffle(lista).map(prepara), feitasN = 0, primeiraCerta = 0;
    const total = fila.length, jaErrou = new Set();
    const proxima = () => {
      if (!fila.length) {
        histPush("Conceitos", `${primeiraCerta}/${total} à 1ª`);
        draw(`<h1>Treino concluído 🎉</h1><div class="card"><div class="score">${primeiraCerta}/${total}</div><div class="sub">certas à primeira</div>
          <div class="row" style="margin-top:12px"><button class="primary" id="denovo">Repetir</button><button id="voltar">Menu</button></div></div>`);
        app.querySelector("#denovo").onclick = () => treino(lista); app.querySelector("#voltar").onclick = menu; return;
      }
      const it = fila[0], q = it.q;
      draw(`
        <div class="top"><button id="sair">← Sair</button><span class="pill">${feitasN}/${total} · faltam ${fila.length}</span></div>
        <div class="prog"><i style="width:${feitasN / total * 100}%"></i></div>
        ${pergunta(it, "t", feitasN + 1)}
        <div class="row" style="justify-content:flex-end"><button class="primary" id="seg" style="display:none">Seguinte →</button></div>
      `);
      app.querySelector("#sair").onclick = menu;
      const seg = app.querySelector("#seg");
      app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
        const i = +b.dataset.i, ok = i === it.correta;
        app.querySelectorAll(".opt").forEach((x, j) => { x.disabled = true; if (j === it.correta) x.classList.add("ok"); else if (j === i) x.classList.add("bad"); });
        app.querySelector(".fb").innerHTML = `<div class="expl">${fbEscolha(it, i)}</div>`;
        math(app);
        marcar(q._id, ok);
        fila.shift();
        if (ok) { feitasN++; if (!jaErrou.has(q._id)) primeiraCerta++; }
        else { jaErrou.add(q._id); fila.push(prepara(q)); }
        seg.style.display = ""; seg.focus();
      });
      seg.onclick = proxima;
    };
    proxima();
  }

  // ---------- ver resoluções ----------
  function verTudo(gSel) {
    const grupos = [...new Set(B.perguntas.map(q => q.grupo || "Perguntas"))];
    const g = gSel || grupos[0];
    const lista = B.perguntas.filter(q => (q.grupo || "Perguntas") === g).sort((a, b) => isReal(b) - isReal(a));
    const mostrar = lista.slice(0, 12);
    draw(`
      <div class="top"><button id="sair">← Menu</button><span class="pill">${lista.length} exercícios</span></div>
      <div class="filtros">${grupos.map(x => `<button data-vg="${esc(x)}" class="${x === g ? "primary" : ""}">${esc(x)}</button>`).join("")}</div>
      ${mostrar.map((q, i) => `
        <div class="card q"><div class="n">${q.tema ? esc(q.tema) : ""}${fonteHtml(q)}</div><div class="e">${esc(q.enunciado)}</div>
        ${q.imagem ? `<img src="${q.imagem}" alt="" style="background:#fff;padding:6px">` : ""}
        ${q.tipo === "escolha" ? q.opcoes.map((o, j) => `<div class="opt ${j === q.correta ? "ok" : ""}"><span class="l">${L[j]}</span><span>${esc(o)}${j !== q.correta && q.porque && q.porque[j] ? `<br><small class="sub">✗ ${esc(q.porque[j])}</small>` : ""}</span></div>`).join("") + (q.explicacao ? `<div class="expl">${esc(q.explicacao)}</div>` : "")
          : q.alineas ? q.alineas.map((a, j) => `<div class="al"><span class="an">${j + 1}.</span><span class="ae">${esc(a.enunciado)}</span><details><summary class="sub" style="cursor:pointer;margin-top:6px">Ver resolução</summary><div class="res">${esc(a.resolucao)}</div></details></div>`).join("")
          : `<div class="res">${esc(q.resolucao || "")}</div>${q.correcao ? `<details><summary class="sub" style="cursor:pointer;margin-top:8px">Ver a correção da professora</summary>${blocoCorrecao(q.correcao)}</details>` : ""}`}
        </div>`).join("")}
      ${lista.length > mostrar.length ? `<p class="sub">A mostrar ${mostrar.length} de ${lista.length}. Os restantes aparecem nos testes modelo.</p>` : ""}
    `);
    app.querySelector("#sair").onclick = menu;
    app.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => d.open && ativaCorrecoes(d)));
    app.querySelectorAll("[data-vg]").forEach(b => b.onclick = () => verTudo(b.dataset.vg));
  }

  menu();
})();
</script>
